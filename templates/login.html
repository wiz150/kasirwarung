<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk · {{ toko.nama }}</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans antialiased min-h-screen grid place-items-center p-4">
  <form method="post" action="{{ url_for('login', next=request.args.get('next','')) }}" class="w-full max-w-sm bg-white rounded-2xl shadow-lg border border-slate-100 p-7">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="w-11 h-11 rounded-xl bg-indigo-500 grid place-items-center text-white font-extrabold text-xl shadow-lg shadow-indigo-200">K</div>
    <h1 class="text-xl font-extrabold text-slate-900 mt-4">Masuk {{ toko.nama }}</h1>
    <p class="text-xs text-slate-500 mt-1">Transaksi akan dicatat atas nama akun Anda.</p>

    {% if error %}<p class="mt-4 text-sm font-semibold text-rose-600 bg-rose-50 px-3 py-2 rounded-xl">{{ error }}</p>{% endif %}

    <label class="block text-xs font-bold text-slate-500 mt-5 mb-1">Username</label>
    <input name="username" required autofocus autocomplete="username"
           class="w-full h-11 px-3 rounded-xl border border-slate-200 bg-slate-50 text-sm outline-none focus:bg-white focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50">
    <label class="block text-xs font-bold text-slate-500 mt-3 mb-1">Password</label>
    <input name="password" type="password" required autocomplete="current-password"
           class="w-full h-11 px-3 rounded-xl border border-slate-200 bg-slate-50 text-sm outline-none focus:bg-white focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50">
    <button class="w-full h-11 mt-6 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-extrabold shadow-lg shadow-indigo-200">Masuk</button>
  </form>
</body>
</html>
