<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutup shift · KasirWarung</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 grid place-items-center p-5 font-sans">
  <form method="post" class="w-full max-w-sm bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1 class="text-lg font-extrabold text-slate-900">Tutup shift dulu</h1>
    <p class="text-sm text-slate-500 mt-1">Masih ada shift aktif. Isi uang akhir untuk bisa keluar.</p>
    <p class="text-xs text-slate-400 mt-2">Transaksi tunai shift ini: Rp {{ '{:,.0f}'.format(tunai) }} · seharusnya Rp {{ '{:,.0f}'.format(harapan) }}</p>
    {% if error %}<p class="mt-3 text-xs font-bold text-rose-600">{{ error }}</p>{% endif %}
    <label class="block text-xs font-bold text-slate-500 mt-4 mb-1">Uang akhir (hitung fisik)</label>
    <input name="akhir" type="number" min="0" required autofocus
           class="w-full h-10 px-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-400">
    <label class="block text-xs font-bold text-slate-500 mt-3 mb-1">Catatan</label>
    <input name="catatan" class="w-full h-10 px-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-400">
    <div class="flex gap-2 mt-6">
      <a href="/" class="h-10 px-4 grid place-items-center rounded-xl border border-slate-200 text-sm font-semibold text-slate-600">Kembali</a>
      <button class="flex-1 h-10 rounded-xl bg-rose-600 text-white text-sm font-bold">Tutup &amp; keluar</button>
    </div>
  </form>
</body>
</html>
