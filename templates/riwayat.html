{% extends 'base.html' %}
{% block page %}riwayat{% endblock %}
{% block content %}
<section class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
  <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row gap-3 sm:items-end">
    <div>
      <label class="block text-xs font-semibold text-slate-500 mb-1">Dari tanggal</label>
      <input id="dari" type="date" class="h-10 px-3 rounded-xl border border-slate-200 bg-slate-50 text-sm outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50 transition duration-150">
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-500 mb-1">Sampai tanggal</label>
      <input id="sampai" type="date" class="h-10 px-3 rounded-xl border border-slate-200 bg-slate-50 text-sm outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50 transition duration-150">
    </div>
    <button id="btn-filter" class="h-10 px-5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow-lg shadow-indigo-200 transition duration-150">Filter</button>
    <button id="btn-reset" class="h-10 px-4 rounded-xl border border-slate-200 text-sm font-semibold text-slate-600 hover:bg-slate-50 transition duration-150">Reset</button>
    {% if session.get('role') == 'admin' %}
    <button id="btn-export-riwayat" class="h-10 px-4 rounded-xl border border-slate-200 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition duration-150">Export CSV</button>
    {% endif %}
    <div class="sm:ml-auto text-right">
      <div class="text-xs text-slate-500">Total penjualan</div>
      <div id="total-filter" class="text-lg font-extrabold text-indigo-600">Rp 0</div>
    </div>
  </div>
  <div class="overflow-x-auto">
    <table class="w-full text-sm min-w-[640px]">
      <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
        <tr><th class="text-left px-5 py-3 font-bold">No. Transaksi</th><th class="text-left px-4 py-3 font-bold">Kasir</th>
            <th class="text-left px-4 py-3 font-bold">Metode</th><th class="text-left px-4 py-3 font-bold">Waktu</th>
            <th class="text-left px-4 py-3 font-bold">Item</th><th class="text-right px-4 py-3 font-bold">Total</th>
            <th class="text-right px-5 py-3 font-bold">Aksi</th></tr>
      </thead>
      <tbody id="tabel-riwayat" class="divide-y divide-slate-100"></tbody>
    </table>
  </div>
  <div class="p-3 border-t border-slate-100 text-center">
    <button id="btn-lebih" class="hidden h-9 px-5 rounded-xl border border-slate-200 text-xs font-bold text-indigo-600 hover:bg-indigo-50">Muat lebih banyak</button>
  </div>
</section>
{% endblock %}
