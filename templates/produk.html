{% extends 'base.html' %}
{% block page %}produk{% endblock %}
{% block content %}
<section class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
  <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row gap-3 sm:items-center">
    <div class="relative flex-1 max-w-sm">
      <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4" stroke-linecap="round"/></svg>
      <input id="cari-produk" type="search" placeholder="Cari produk..." autocomplete="off"
             class="w-full h-10 pl-9 pr-3 rounded-xl border border-slate-200 bg-slate-50 text-sm outline-none focus:bg-white focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50 transition duration-150">
    </div>
    <div class="flex gap-2 sm:ml-auto">
      <button id="btn-import" class="h-10 px-4 rounded-xl border border-slate-200 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition duration-150">Import CSV</button>
      <a href="/api/produk/export" class="h-10 px-4 rounded-xl border border-slate-200 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition duration-150 grid place-items-center">Export CSV</a>
      <button id="btn-tambah" class="h-10 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow-lg shadow-indigo-200 transition duration-150">+ Produk Baru</button>
      <input id="file-csv" type="file" accept=".csv" class="hidden">
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-sm min-w-[640px]">
      <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
        <tr><th class="text-left px-5 py-3 font-bold">Produk</th><th class="text-left px-4 py-3 font-bold">Kategori</th>
            <th class="text-right px-4 py-3 font-bold">Harga</th><th class="text-center px-4 py-3 font-bold">Stok</th>
            <th class="text-right px-5 py-3 font-bold">Aksi</th></tr>
      </thead>
      <tbody id="tabel-produk" class="divide-y divide-slate-100"></tbody>
    </table>
  </div>
  <div class="px-5 py-3 border-t border-slate-100 text-xs text-slate-500"><span id="info-produk"></span></div>
</section>
{% endblock %}
